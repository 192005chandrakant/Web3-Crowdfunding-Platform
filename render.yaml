services:
  - type: web
    name: milestonechain-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BLOCKCHAIN_MODE
        value: rpc
      - key: CHAIN_ID
        value: 80002
      - key: CAMPAIGN_FACTORY_ADDRESS
        value: 0x4B3E9091e8A15AdcC8fcC1FCC7D6D273F4Cc2D01
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: MONGODB_URI
        sync: false
      - key: ALCHEMY_AMOY_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_API_SECRET
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WEBHOOK_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false

